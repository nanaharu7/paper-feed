name: paper-feed

on:
  schedule:
    # 毎週月曜 7:00 JST（日曜 22:00 UTC）
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-feed
  cancel-in-progress: false

jobs:
  feed:
    # テンプレート元のリポジトリでは動かさない
    if: github.repository != 'nanaharu7/paper-feed'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paper-feed
        run: pip install ".[api]"

      - name: Install Claude Code
        if: hashFiles('config.yaml') != ''
        run: |
          if grep -Eq '^\s*mode:\s*claude-code' config.yaml; then
            npm install -g @anthropic-ai/claude-code
          fi

      - name: Fetch and summarize
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: paper-feed run

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 新着論文を追加する ($(date -u +%F))"
            git push
          fi

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: paper-feed notify
