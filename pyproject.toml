[project]
name = "paper-feed"
version = "0.1.0"
description = "興味のあるトピックの新着論文を毎週集め、LLM で選別・要約して Markdown にまとめる"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["anthropic>=2.8"]
dev = [
    "anthropic>=2.8",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
paper-feed = "paper_feed.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_feed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["paper_feed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
